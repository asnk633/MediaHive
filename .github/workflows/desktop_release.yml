name: 'MediaHive Desktop - Build & Publish'

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Import Code Signing Certificate
        shell: pwsh
        run: |
          $pfxBase64 = "${{ secrets.WINDOWS_PFX_BASE64 }}"
          if ([string]::IsNullOrEmpty($pfxBase64)) {
            Write-Error "WINDOWS_PFX_BASE64 secret is not configured in this repository. Please configure it under Secrets."
            exit 1
          }
          $pfxPassword = "${{ secrets.WINDOWS_PFX_PASSWORD }}"
          $pfxBytes = [System.Convert]::FromBase64String($pfxBase64)
          $pfxPath = Join-Path $env:TEMP "mediahive-signer.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          
          $securePassword = ConvertTo-SecureString $pfxPassword -AsPlainText -Force
          Import-PfxCertificate -CertStoreLocation Cert:\CurrentUser\My -FilePath $pfxPath -Password $securePassword
          Write-Host "Successfully imported certificate into Cert:\CurrentUser\My"

      - name: Install Frontend Dependencies
        working-directory: "MediaHive Windows app"
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Build Next.js Frontend
        working-directory: "MediaHive Windows app"
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm run build

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        with:
          tauriScript: pnpm tauri
          tagName: desktop-v__VERSION__
          releaseName: 'MediaHive Desktop v__VERSION__'
          releaseBody: 'Install MediaHive for Windows below. OTA updates are enabled.'
          releaseDraft: true
          prerelease: false
          projectPath: "MediaHive Windows app"
          args: ${{ matrix.args }}
