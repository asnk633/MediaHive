<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLTF Macbook Debugger</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: monospace; overflow: hidden; }
    #controls {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(0,0,0,0.85);
      padding: 15px;
      border-radius: 8px;
      z-index: 10;
      max-width: 400px;
      line-height: 1.5;
    }
    input[type=range] { width: 100%; }
    .info { margin-top: 10px; color: #aaa; font-size: 11px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="controls">
    <h3>Macbook Hinge Debugger</h3>
    <div>
      Lid Rotation X: <span id="rot-val">0.00</span> rad
      <input type="range" id="lid-rot" min="-3.14" max="3.14" step="0.05" value="0">
    </div>
    <div style="margin-top: 10px;">
      Camera Position: <span id="cam-val"></span>
    </div>
    <div class="info" id="node-info">Loading model...</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    let scene, camera, renderer, controls;
    let lidNode = null;
    let baseNode = null;
    let modelGroup = null;

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);
      scene.add(new THREE.GridHelper(10, 10));

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0.4, 0.3, 0.6);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.update();

      // Lighting
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(3, 10, 5);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Load model
      const loader = new GLTFLoader();
      loader.load('/models/macbook_pro_14_inch_M5.glb', (gltf) => {
        modelGroup = gltf.scene;
        scene.add(modelGroup);

        document.getElementById('node-info').innerHTML = 'Model loaded successfully!<br>Traversing nodes...';

        // Traverse to find nodes
        modelGroup.traverse((child) => {
          if (child.name === 'RcexTyyhpuJYATQ') {
            lidNode = child;
          }
          if (child.name === 'EhCmdLAMoLoXcIA') {
            baseNode = child;
          }
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        if (lidNode) {
          document.getElementById('node-info').innerHTML += `<br>Found Lid Node: <b>${lidNode.name}</b>`;
        } else {
          document.getElementById('node-info').innerHTML += '<br><span style="color:red">Lid Node not found!</span>';
        }
        if (baseNode) {
          document.getElementById('node-info').innerHTML += `<br>Found Base Node: <b>${baseNode.name}</b>`;
        }
      }, undefined, (err) => {
        document.getElementById('node-info').innerHTML = '<span style="color:red">Error loading model: ' + err + '</span>';
      });

      // Slider event
      document.getElementById('lid-rot').addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        document.getElementById('rot-val').innerText = val.toFixed(2);
        if (lidNode) {
          lidNode.rotation.x = val;
        }
      });

      window.addEventListener('resize', onResize);
      animate();
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      
      document.getElementById('cam-val').innerText = 
        `x:${camera.position.x.toFixed(2)} y:${camera.position.y.toFixed(2)} z:${camera.position.z.toFixed(2)}`;

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
