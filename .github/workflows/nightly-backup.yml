name: Nightly Database Backup

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      TURSO_CONNECTION_URL: ${{ secrets.TURSO_CONNECTION_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66dd77 # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install libsql-shell
        run: |
          # Install libsql-shell for database operations
          pnpm install -g @libsql/libsql-shell

      - name: Create backup directory
        run: |
          mkdir -p backups
          echo "Backup directory created"

      - name: Export database as SQL
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BACKUP_FILE="backup-${TIMESTAMP}.sql"
          
          echo "Exporting database to ${BACKUP_FILE}"
          node scripts/backup/export-db.js --format sql --output "backups/${BACKUP_FILE}"
          
          echo "BACKUP_FILE=${BACKUP_FILE}" >> $GITHUB_ENV
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

      - name: Encrypt backup before upload
        run: |
          gpg --batch --symmetric --passphrase "${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}" \
            --output backups/${{ env.BACKUP_FILE }}.gpg backups/${{ env.BACKUP_FILE }}
          rm backups/${{ env.BACKUP_FILE }}

      - name: Upload encrypted backup as artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec7 # v4.6.2
        with:
          path: backups/${{ env.BACKUP_FILE }}.gpg
          retention-days: 7 # Reduced from 30 days

      - name: Cleanup old backups (local)
        run: |
          # Keep only the most recent 10 backup files locally
          cd backups
          ls -t backup-*.sql | tail -n +11 | xargs -r rm
          echo "Old local backups cleaned up"

      - name: Verify backup
        run: |
          # Basic verification - check if file exists and has content
          if [ -f "backups/${{ env.BACKUP_FILE }}" ]; then
            FILE_SIZE=$(stat -c%s "backups/${{ env.BACKUP_FILE }}")
            if [ $FILE_SIZE -gt 0 ]; then
              echo "✅ Backup verified successfully (size: ${FILE_SIZE} bytes)"
            else
              echo "❌ Backup file is empty"
              exit 1
            fi
          else
            echo "❌ Backup file not found"
            exit 1
          fi

      - name: Send notification on failure
        if: failure()
        run: |
          echo "🚨 Nightly backup failed on ${{ github.repository }}"
          echo "Check the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"