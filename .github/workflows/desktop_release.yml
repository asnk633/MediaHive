name: 'MediaHive Desktop - Build & Publish'

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        working-directory: "MediaHive Windows app"
        run: pnpm install --no-frozen-lockfile

      - name: Build Next.js Frontend
        working-directory: "MediaHive Windows app"
        run: pnpm run build

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: desktop-v__VERSION__
          releaseName: 'MediaHive Desktop v__VERSION__'
          releaseBody: 'Install MediaHive for Windows below. OTA updates are enabled.'
          releaseDraft: true
          prerelease: false
          projectPath: "MediaHive Windows app"
          args: ${{ matrix.args }}
