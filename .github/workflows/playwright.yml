name: Playwright E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --max-old-space-size=2048
      BASE_URL: http://127.0.0.1:3000

      # If Playwright UI needs Firebase in the app, you can also pass these:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_E2E: 1
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      FIREBASE_ADMIN_SA_PATH: ${{ github.workspace }}/service-account.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Decode service account (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          FIREBASE_ADMIN_SA: ${{ secrets.FIREBASE_ADMIN_SA }}
        run: |
          if [ -z "${FIREBASE_ADMIN_SA:-}" ]; then
            echo "FIREBASE_ADMIN_SA secret is missing"
            exit 1
          fi
          if echo "$FIREBASE_ADMIN_SA" | grep -q '^{'; then
            echo "$FIREBASE_ADMIN_SA" > "$FIREBASE_ADMIN_SA_PATH"
          else
            echo "$FIREBASE_ADMIN_SA" | base64 --decode > "$FIREBASE_ADMIN_SA_PATH"
          fi
          ls -la "$FIREBASE_ADMIN_SA_PATH"

      - name: Decode service account (Windows)
        if: runner.os == 'Windows'
        env:
          FIREBASE_ADMIN_SA: ${{ secrets.FIREBASE_ADMIN_SA }}
        run: |
          if (-not "$env:FIREBASE_ADMIN_SA") {
            Write-Host "FIREBASE_ADMIN_SA secret is missing"
            exit 1
          }
          Set-Content -Path $env:FIREBASE_ADMIN_SA_PATH -Value $env:FIREBASE_ADMIN_SA -Encoding UTF8
          Get-Item $env:FIREBASE_ADMIN_SA_PATH | Format-List
        shell: pwsh

      - name: Create .env.local
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local
          echo "E2E_ADMIN_EMAIL=admin@mediahive.test" >> .env.local
          echo "E2E_ADMIN_PASSWORD=testpassword123" >> .env.local
          echo "E2E_GUEST_EMAIL=guest@mediahive.test" >> .env.local
          echo "E2E_GUEST_PASSWORD=testpassword123" >> .env.local

      # Install Playwright browsers
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Start Next.js app (background)
        run: |
          nohup pnpm dev > app.log 2>&1 &
          echo "Waiting for Next.js to start..."
          sleep 25

      # NOTE: No user seeding step needed. global-setup.ts uses the
      # playwright_test_auth localStorage bypass so no real Supabase
      # credentials are required during E2E tests.

      # Run Playwright tests (uses playwright.config.ts which runs global-setup first)
      - name: Run Playwright tests
        run: pnpm exec playwright test --retries=0

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: |
            test-results
            playwright-report
            app.log