name: Playwright Nightly Full Coverage

on:
  schedule:
    # Run every night at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  nightly-e2e:
    name: Nightly E2E Test Suite
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_GUEST_EMAIL: ${{ secrets.E2E_GUEST_EMAIL }}
      E2E_GUEST_PASSWORD: ${{ secrets.E2E_GUEST_PASSWORD }}
  E2E_MEMBER_EMAIL: "member@example.com"

  E2E_MEMBER_PASSWORD: "password"
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
  E2E_ADMIN_EMAIL: "admin@example.com"

  E2E_ADMIN_PASSWORD: "password"

  E2E_GUEST_EMAIL: "guest@example.com"

  E2E_GUEST_PASSWORD: "password"
  E2E_MEMBER_EMAIL: "member@example.com"

  E2E_MEMBER_PASSWORD: "password"

  SUPABASE_URL: "http://localhost:54321"

  SUPABASE_SERVICE_ROLE_KEY: "testkey"
      NEXT_PUBLIC_E2E: 1
      DATABASE_URL: "file:./ci.db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preflight Env Check
        run: npx tsx scripts/check-e2e-env.ts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build Next.js app
        run: pnpm run build

      - name: Start app in background
        run: |
          pnpm run start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: pnpm exec playwright test

      - name: Verify Database Cleanup
        if: always()
        run: npx tsx scripts/verify-cleanup.ts

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
