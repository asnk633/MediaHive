<script type="module">
import * as THREE from 'three';
window.THREE = THREE;
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ─── GLOBALS ──────────────────────────────────────────────
let renderer, scene, camera, composer;
let laptopBase, laptopLid, lidPivot, screenMaterial, keyLight, screenRimLight;
let clapperboard, sdCard, lensCap, cableGroup, notebook, coffeeCup;
let succulent, headphones, pens = [], stickyNotes = [], lidNote;
let sceneGroup, deskMesh, laptopGroup;
let screenMesh, screenCanvas, screenCtx, screenTexture, logoImg;
const logoOpacity = { value: 0.0 };
const clock = new THREE.Clock();

// ─── DYNAMIC SCREEN CANVAS TEXTURE ────────────────────────
function initScreenCanvas() {
  screenCanvas = document.createElement('canvas');
  screenCanvas.width = 1024;
  screenCanvas.height = 512;
  screenCtx = screenCanvas.getContext('2d');

  logoImg = new Image();
  logoImg.src = '/Media Hive final logo.png';
  logoImg.onload = () => {
    drawScreen();
  };
  logoImg.onerror = (e) => {
    console.error('Failed to load MediaHive logo image', e);
  };
  
  drawScreen();
  screenTexture = new THREE.CanvasTexture(screenCanvas);
  screenTexture.minFilter = THREE.LinearFilter;
  screenTexture.colorSpace = THREE.SRGBColorSpace;
}

function drawScreen() {
  if (!screenCtx) return;

  // 1. Draw OS background gradient
  const grad = screenCtx.createRadialGradient(512, 256, 100, 512, 256, 600);
  grad.addColorStop(0, '#0f172a');
  grad.addColorStop(1, '#020617');
  screenCtx.fillStyle = grad;
  screenCtx.fillRect(0, 0, 1024, 512);

  // 2. Draw subtle tech grid overlay
  screenCtx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
  screenCtx.lineWidth = 1;
  for (let i = 0; i < 1024; i += 64) {
    screenCtx.beginPath();
    screenCtx.moveTo(i, 0);
    screenCtx.lineTo(i, 512);
    screenCtx.stroke();
  }
  for (let j = 0; j < 512; j += 64) {
    screenCtx.beginPath();
    screenCtx.moveTo(0, j);
    screenCtx.lineTo(1024, j);
    screenCtx.stroke();
  }

  // 3. Draw brand logo and brand text with animated opacity
  if (logoOpacity.value > 0) {
    screenCtx.save();
    screenCtx.globalAlpha = logoOpacity.value;

    // Glowing drop shadow for the logo
    if (logoOpacity.value > 0.05) {
      screenCtx.shadowColor = '#ffd700';
      screenCtx.shadowBlur = 30 * logoOpacity.value;
    }

    // Stacked composition: Logo (top) + Text (bottom)
    const logoSize = 220;
    const logoX = (1024 - logoSize) / 2;
    const logoY = 90;
    if (logoImg && logoImg.complete) {
      screenCtx.drawImage(logoImg, logoX, logoY, logoSize, logoSize);
    }

    // Draw premium brand typography below
    screenCtx.shadowBlur = 0; // disable shadow for text sharpness
    screenCtx.fillStyle = '#ffffff';
    screenCtx.font = '800 52px "Inter", -apple-system, sans-serif';
    screenCtx.textAlign = 'center';
    screenCtx.textBaseline = 'middle';
    screenCtx.fillText('MediaHive', 512, 360);

    // Subtitle tagline
    screenCtx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    screenCtx.font = '500 22px "Inter", -apple-system, sans-serif';
    screenCtx.fillText('Turning Media Chaos Into Organized Excellence', 512, 415);

    screenCtx.restore();
  }

  if (screenTexture) {
    screenTexture.needsUpdate = true;
  }
}

// ─── INIT ─────────────────────────────────────────────────
function init() {
  // Renderer
  const canvas = document.getElementById('three-canvas');
  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: false,
    powerPreference: 'high-performance'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06090f);
  scene.fog = new THREE.FogExp2(0x06090f, 0.035);

  // Camera — 3/4 angle
  camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(4.0, 3.2, 6.0);
  camera.lookAt(0, 0.35, 0);

  // Scene group
  sceneGroup = new THREE.Group();
  scene.add(sceneGroup);

  // Initialize screen canvas
  initScreenCanvas();

  buildEnvironment();
  buildDesk();
  buildClutterObjects();

  // Load laptop asynchronously
  buildLaptop(() => {
    // Hide loading screen
    const loadingScreen = document.getElementById('loading-screen');
    if (loadingScreen) {
      loadingScreen.style.opacity = '0';
      loadingScreen.style.visibility = 'hidden';
      setTimeout(() => loadingScreen.remove(), 800);
    }

    setupLighting();
    setupPostProcessing();
    setupAnimationTimeline();

    window.addEventListener('resize', onResize);
    window.addEventListener('beforeunload', cleanupMemory);

    animate();
  });

  // Expose for runtime diagnostics
  window.camera = camera;
  window.scene = scene;
}

// ─── CLEANUP MEMORY ───────────────────────────────────────
function cleanupMemory() {
  window.removeEventListener('resize', onResize);
  window.removeEventListener('beforeunload', cleanupMemory);

  scene.traverse((child) => {
    if (child.isMesh) {
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        if (Array.isArray(child.material)) {
          child.material.forEach((mat) => {
            if (mat.map) mat.map.dispose();
            if (mat.emissiveMap) mat.emissiveMap.dispose();
            mat.dispose();
          });
        } else {
          if (child.material.map) child.material.map.dispose();
          if (child.material.emissiveMap) child.material.emissiveMap.dispose();
          child.material.dispose();
        }
      }
    }
  });

  if (screenTexture) screenTexture.dispose();
  if (renderer) renderer.dispose();
}

// ─── ENVIRONMENT MAP ──────────────────────────────────────
function createEnvMap() {
  const pmremGen = new THREE.PMREMGenerator(renderer);
  pmremGen.compileEquirectangularShader();
  scene.environment = pmremGen.fromScene(new RoomEnvironment(), 0.04).texture;
  pmremGen.dispose();
}

function buildEnvironment() {
  createEnvMap();
}

// ─── PROCEDURAL WOOD TEXTURE GENERATOR ──────────────────
function createWoodTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');
  
  // Base wood color (rich dark mahogany/walnut)
  ctx.fillStyle = '#22150c';
  ctx.fillRect(0, 0, 1024, 1024);
  
  // Draw base grain stripes
  ctx.fillStyle = '#1b1008';
  for (let i = 0; i < 60; i++) {
    const w = Math.random() * 25 + 5;
    const x = Math.random() * 1024;
    ctx.fillRect(x, 0, w, 1024);
  }
  
  // Draw waves/rings using overlapping sine waves
  ctx.strokeStyle = '#2d1c10';
  ctx.lineWidth = 2.0;
  for (let y = 0; y < 1024; y += 4) {
    ctx.beginPath();
    for (let x = 0; x < 1024; x += 15) {
      const wave = Math.sin(x * 0.004) * 12 + Math.sin(x * 0.015) * 3;
      if (x === 0) ctx.moveTo(x, y + wave);
      else ctx.lineTo(x, y + wave);
    }
    ctx.stroke();
  }
  
  // Subtle knots
  ctx.fillStyle = '#140c06';
  for (let i = 0; i < 3; i++) {
    const kx = Math.random() * 800 + 100;
    const ky = Math.random() * 800 + 100;
    ctx.beginPath();
    ctx.ellipse(kx, ky, 25, 12, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Vignette overlay
  const grad = ctx.createRadialGradient(512, 512, 100, 512, 512, 850);
  grad.addColorStop(0, 'rgba(255, 255, 255, 0.03)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0.7)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 1024);
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  return texture;
}

// ─── BUILD DESK SURFACE ───────────────────────────────────
function buildDesk() {
  const woodTex = createWoodTexture();
  
  const deskGeo = new THREE.BoxGeometry(14, 0.15, 8);
  const deskMat = new THREE.MeshStandardMaterial({
    map: woodTex,
    roughness: 0.65,
    metalness: 0.05,
  });
  deskMesh = new THREE.Mesh(deskGeo, deskMat);
  deskMesh.position.set(0, -0.075, 0);
  deskMesh.receiveShadow = true;
  deskMesh.castShadow = false;
  sceneGroup.add(deskMesh);

  // Desk edge highlight strip
  const edgeGeo = new THREE.BoxGeometry(14, 0.02, 0.03);
  const edgeMat = new THREE.MeshStandardMaterial({
    color: 0x3d2c20, roughness: 0.5, metalness: 0.2
  });
  const edgeMesh = new THREE.Mesh(edgeGeo, edgeMat);
  edgeMesh.position.set(0, 0.076, 4.01);
  sceneGroup.add(edgeMesh);

  // Desk legs
  for (let x of [-5.8, 5.8]) {
    const legGeo = new THREE.BoxGeometry(0.2, 3, 0.2);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x140e0a, roughness: 0.9 });
    const leg = new THREE.Mesh(legGeo, legMat);
    leg.position.set(x, -1.65, -3.5);
    leg.receiveShadow = true;
    sceneGroup.add(leg);
  }
}

// ─── BUILD LAPTOP ─────────────────────────────────────────
function buildLaptop(onLoaded) {
  const loader = new GLTFLoader();
  loader.load(
    '/models/macbook_pro_14_inch_M5.glb',
    (gltf) => {
      laptopGroup = gltf.scene;

      // Scale model up by 8.0 to match the original layout dimensions
      laptopGroup.scale.set(8.0, 8.0, 8.0);
      
      // Position base bottom flush on the desk surface (Y = 0)
      // Z bounds min in GLTF was -0.34, at scale 8.0 it is -0.34 * 8.0 = -0.272.
      // Offset by 0.27 to align it perfectly with the desk surface.
      laptopGroup.position.set(0, 0.27, 0);

      laptopGroup.traverse((child) => {
        if (child.name === 'RcexTyyhpuJYATQ') {
          laptopLid = child;
        }
        if (child.name === 'tfTbkkzhxqpKRgC') {
          screenMesh = child;
          
          // Create a new material using our canvas texture instead of overwriting the GLTF's original immutable material texture
          screenMaterial = new THREE.MeshStandardMaterial({
            map: screenTexture,
            emissiveMap: screenTexture,
            emissive: new THREE.Color(0xffffff),
            emissiveIntensity: 0.0,
            roughness: 0.2,
            metalness: 0.1
          });
          child.material = screenMaterial;
        }
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      // Hinge pivot point calculation:
      // The lid mesh local bounds are Y from -19 to -10.5, Z from -20 to 0.6.
      // Scaling factor inside model is 0.01. So in local coordinates of RcexTyyhpuJYATQ, 
      // the hinge center is at roughly Y = -0.11, Z = 0.005.
      // Create a pivot group for the lid:
      lidPivot = new THREE.Group();
      lidPivot.name = "lidPivot";
      
      // Node 62 is the common parent of base (43) and lid (61). We want to add the pivot to Node 62, 
      // put the lid (61) inside the pivot, offset the lid, and animate the pivot instead.
      const parentNode = laptopGroup.getObjectByName('nIhhmAXgzOpXafM');
      if (parentNode && laptopLid) {
        // Place the pivot at the hinge line relative to parent node
        // In local unrotated coordinates, the hinge center is at Y = -11.46, Z = -0.42
        lidPivot.position.set(0, -11.46, -0.42);
        parentNode.add(lidPivot);
        
        // Remove lid from parent and add to pivot
        laptopLid.parent.remove(laptopLid);
        lidPivot.add(laptopLid);
        
        // --- Auto-Calibration for Perfect Alignment (Feedback Loop) ---
        let scaleY = 1.028;
        let scaleZ = 1.028;
        let posZOffset = 0;
        
        for (let iter = 0; iter < 5; iter++) {
          laptopLid.scale.set(1.0, scaleY, scaleZ);
          laptopLid.position.set(0, 11.46 * scaleY, 0.42 * scaleZ + posZOffset);
          lidPivot.rotation.x = 1.91; // closed
          lidPivot.updateMatrixWorld(true);
          
          const boxLid = new THREE.Box3().setFromObject(laptopLid);
          const sizeLid = new THREE.Vector3();
          boxLid.getSize(sizeLid);
          
          // Hide lid to calculate base bounding box
          laptopLid.visible = false;
          const boxBase = new THREE.Box3().setFromObject(parentNode);
          const sizeBase = new THREE.Vector3();
          boxBase.getSize(sizeBase);
          laptopLid.visible = true;
          
          const diffMinZ = boxBase.min.z - boxLid.min.z;
          posZOffset += diffMinZ;
          
          const depthRatio = sizeBase.z / sizeLid.z;
          scaleY *= depthRatio;
        }
        
        // Apply final calibrated values
        laptopLid.scale.set(1.0, scaleY, scaleZ);
        laptopLid.position.set(0, 11.46 * scaleY, 0.42 * scaleZ + posZOffset);
      }

      // Initialize lid to closed position
      lidPivot.rotation.x = 1.91; // Closed

      sceneGroup.add(laptopGroup);

      if (onLoaded) onLoaded();
    },
    (xhr) => {
      if (xhr.lengthComputable) {
        const percent = (xhr.loaded / xhr.total) * 100;
        const bar = document.getElementById('loading-bar');
        const text = document.getElementById('loading-text');
        if (bar) bar.style.width = percent + '%';
        if (text) text.innerText = `Loading 3D workspace... ${Math.round(percent)}%`;
      }
    },
    (err) => {
      console.error('Failed to load GLTF model:', err);
      // Still trigger callback to prevent hanging screen on fail
      if (onLoaded) onLoaded();
    }
  );
}

// ─── PROCEDURAL COFFEE CUP TEXTURE ──────────────────────
function createCoffeeCupTexture() {
  const canvas = document.createElement('canvas');

  canvas.height = 256;
  const ctx = canvas.getContext('2d');

// ─── PROCEDURAL NOTEBOOK PAGES TEXTURE ──────────────────
function createNotebookTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  
  // Page background (creamy sketch paper)
  ctx.fillStyle = '#fbf9f4';
  ctx.fillRect(0, 0, 512, 512);
  
  // Middle fold binding gradient shadow
  const grad = ctx.createLinearGradient(244, 0, 268, 0);
  grad.addColorStop(0, 'rgba(0,0,0,0.0)');
  grad.addColorStop(0.5, 'rgba(0,0,0,0.22)');
  grad.addColorStop(1, 'rgba(0,0,0,0.0)');
  ctx.fillStyle = grad;
  ctx.fillRect(244, 0, 24, 512);
  
  // Left Page
  ctx.fillStyle = 'rgba(25,25,35,0.85)';
  ctx.font = 'bold 20px "Arial", sans-serif';
  ctx.fillText('BRANDING IDEAS', 40, 55);
  
  // Geometric sketches (Left)
  ctx.strokeStyle = 'rgba(50,50,70,0.6)';
  ctx.lineWidth = 2.5;
  ctx.strokeRect(60, 95, 110, 110);
  ctx.beginPath();
  ctx.moveTo(80, 115);
  ctx.lineTo(150, 115);
  ctx.lineTo(150, 185);
  ctx.lineTo(95, 185);
  ctx.lineTo(95, 140);
  ctx.lineTo(135, 140);
  ctx.stroke();
  
  // Hexagon logo sketches (Left bottom)
  ctx.beginPath();
  for (let i = 0; i <= 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const x = 115 + Math.cos(angle) * 45;
    const y = 330 + Math.sin(angle) * 45;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(115, 285);
  ctx.lineTo(115, 375);
  ctx.moveTo(76, 308);
  ctx.lineTo(154, 353);
  ctx.moveTo(76, 353);
  ctx.lineTo(154, 308);
  ctx.stroke();
  
  // Right Page
  ctx.fillStyle = 'rgba(25,25,35,0.85)';
  ctx.font = 'bold 20px "Arial", sans-serif';
  ctx.fillText('LOGO VARS', 300, 55);
  
  // Detailed logo ribbon sketch (reminiscent of hive hexagon)
  ctx.strokeStyle = 'rgba(85,62,25,0.55)'; // sepia ink pen
  ctx.lineWidth = 3.5;
  const cx = 385, cy = 190, r = 65;
  ctx.beginPath();
  for (let i = 0; i <= 6; i++) {
    const angle = (i / 6) * Math.PI * 2 - Math.PI / 6;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  
  // Isometric inner projections
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const angle = (i * 120 - 30) * Math.PI / 180;
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
  }
  ctx.stroke();
  
  // Handwritten comments
  ctx.fillStyle = 'rgba(95,95,115,0.7)';
  ctx.font = 'italic 15px "Comic Sans MS", "Caveat", cursive';
  ctx.fillText('clean lines', 60, 230);
  ctx.fillText('hex design?', 310, 290);
  ctx.fillText('brand match', 315, 310);
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  return texture;
}

// ─── PROCEDURAL STICKY NOTE TEXTURE ──────────────────────
function createStickyNoteTexture(text, bgColor) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  
  // Sticky note body color
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, 256, 256);
  
  // Subtle paper outline border
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, 252, 252);
  
  // Cursive handwritten text
  ctx.fillStyle = 'rgba(12,12,18,0.85)';
  ctx.font = 'bold 25px "Comic Sans MS", "Caveat", "Arial", cursive';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  const lines = text.split('\n');
  const startY = 128 - ((lines.length - 1) * 18);
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], 128, startY + i * 36);
  }
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  return texture;
}

function createSucculent() {
  const plantGroup = new THREE.Group();
  
  // Terracotta clay pot
  const potGeo = new THREE.CylinderGeometry(0.24, 0.17, 0.35, 18);
  const potMat = new THREE.MeshStandardMaterial({ color: 0xc47451, roughness: 0.78, metalness: 0.05 });
  const pot = new THREE.Mesh(potGeo, potMat);
  pot.position.y = 0.175;
  pot.castShadow = true;
  pot.receiveShadow = true;
  plantGroup.add(pot);
  
  // Soil
  const soilGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.04, 16);
  const soilMat = new THREE.MeshStandardMaterial({ color: 0x4a2a16, roughness: 0.95 });
  const soil = new THREE.Mesh(soilGeo, soilMat);
  soil.position.y = 0.33;
  plantGroup.add(soil);
  
  // Concentric layered thick leaf spheres
  const leaves = new THREE.Group();
  leaves.position.y = 0.35;
  
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x6e9c73, roughness: 0.75, metalness: 0.05 });
  const rings = [
    { count: 9, radius: 0.15, size: 0.08, scaleY: 0.5, tilt: 0.45 },
    { count: 7, radius: 0.09, size: 0.065, scaleY: 0.6, tilt: 0.28 },
    { count: 5, radius: 0.04, size: 0.048, scaleY: 0.7, tilt: 0.12 }
  ];
  
  rings.forEach((ring, ringIdx) => {
    for (let i = 0; i < ring.count; i++) {
      const angle = (i / ring.count) * Math.PI * 2 + (ringIdx * 0.45);
      const leafGeo = new THREE.SphereGeometry(ring.size, 8, 8);
      leafGeo.scale(0.5, ring.scaleY, 1.25);
      const leaf = new THREE.Mesh(leafGeo, leafMat);
      
      leaf.position.x = Math.cos(angle) * ring.radius;
      leaf.position.z = Math.sin(angle) * ring.radius;
      leaf.position.y = ringIdx * 0.035;
      
      leaf.rotation.y = -angle;
      leaf.rotation.x = ring.tilt;
      leaf.castShadow = true;
      leaves.add(leaf);
    }
  });
  
  plantGroup.add(leaves);
  return plantGroup;
}

function createHeadphones() {
  const hp = new THREE.Group();
  
  const hpMat = new THREE.MeshStandardMaterial({ color: 0x16161c, roughness: 0.55, metalness: 0.25 });
  const metalMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c8, roughness: 0.3, metalness: 0.85 });

  const bandGeo = new THREE.TorusGeometry(0.38, 0.032, 12, 48, Math.PI * 1.15);
  const band = new THREE.Mesh(bandGeo, hpMat);
  band.rotation.z = -Math.PI * 0.575;
  band.position.y = 0.28;
  band.castShadow = true;
  hp.add(band);
  
  // Metal extension sliders
  for (let side of [-1, 1]) {
    const sliderGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.18, 8);
    const slider = new THREE.Mesh(sliderGeo, metalMat);
    slider.position.set(side * 0.38, 0.16, 0);
    slider.rotation.z = side * 0.08;
    slider.castShadow = true;

  // Ear cups and cushions
  for (let side of [-1, 1]) {
    const cupGroup = new THREE.Group();

    cupGroup.rotation.z = side * 0.16;
    
    // Outer cup housing
    const outerCupGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.08, 18);
    const outerCup = new THREE.Mesh(outerCupGeo, hpMat);
    outerCup.rotation.z = Math.PI / 2;

}

// ─── POST-PROCESSING ──────────────────────────────────────
function setupPostProcessing() {
  composer = new EffectComposer(renderer);

  const renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);

  // Bokeh DoF - starts focused on laptop at 7.82m
  const bokehPass = new BokehPass(scene, camera, {
    focus: 7.82,
    aperture: 0.012,
    maxblur: 0.008,
    width: window.innerWidth,
    height: window.innerHeight,
  });
  composer.addPass(bokehPass);

  const outputPass = new OutputPass();
  composer.addPass(outputPass);
}

  // Coffee Cup
  tl.to(coffeeCup.position, { x: -8, y: -1.2, z: 2.5, duration: 1.0, ease: "power2.in" }, 0.2)
    .to(coffeeCup.scale, { x: 0, y: 0, z: 0, duration: 0.9, ease: "power2.in" }, 0.2);

  // Succulent
  tl.to(succulent.position, { x: 8, y: -0.8, z: -3, duration: 1.0, ease: "power2.in" }, 0.12)
    .to(succulent.scale, { x: 0, y: 0, z: 0, duration: 0.9, ease: "power2.in" }, 0.12);

  // Headphones
  tl.to(headphones.position, { x: 8.2, y: 1.2, z: 3.5, duration: 1.0, ease: "power2.in" }, 0.05)
    .to(headphones.scale, { x: 0, y: 0, z: 0, duration: 0.9, ease: "power2.in" }, 0.05);

  // Pens
  pens.forEach((pen, idx) => {
    const t = 0.08 + idx * 0.04;
    tl.to(pen.position, { x: -7 - idx * 0.4, y: -0.8, z: 1.2 + idx * 0.15, duration: 0.8, ease: "power2.in" }, t)
      .to(pen.scale, { x: 0, y: 0, z: 0, duration: 0.7, ease: "power2.in" }, t);
  });

  // Desk Sticky Notes
  stickyNotes.forEach((note, idx) => {
    if (note !== lidNote) {
      const t = 0.05 + idx * 0.05;
      tl.to(note.position, { y: 2.2, x: (idx % 2 === 0 ? -6.5 : 6.5), z: 0.0, duration: 0.9, ease: "power2.inOut" }, t)
        .to(note.scale, { x: 0, y: 0, z: 0, duration: 0.8, ease: "power2.in" }, t);
    }
  });

  // Peel sticky note off the laptop lid and fly off
  tl.to(lidNote.position, { y: 1.8, z: 3.5, x: -1.5, duration: 0.8, ease: "power2.inOut" }, 0.15)
    .to(lidNote.rotation, { x: Math.PI, duration: 0.8, ease: "power2.inOut" }, 0.15)
    .to(lidNote.scale, { x: 0, y: 0, z: 0, duration: 0.7, ease: "power2.in" }, 0.15);

  // ─── SCROLL 40% - 80% (Camera Zoom & Laptop Lid Open) ───
  // Smoothly move camera close & center (from 1.2 to 2.4s)
  tl.to(camera.position, { 
    x: 0.0, 
    y: 1.62, 
    z: 2.85, 
    duration: 1.2, 
    ease: "power2.inOut",
    onUpdate: () => {
      camera.lookAt(0, 0.35, 0);
    }
  }, 1.2);

  // Open laptop lid (rotates from 1.91 closed to 0.0 open)
  tl.fromTo(lidPivot.rotation, { x: 1.91 }, { x: 0.0, duration: 1.2, ease: "power2.inOut" }, 1.2);

  // Dynamic Bokeh focal tracking - move focus from 7.82m to 3.12m
  const bokehPassObj = composer.passes[1];
  if (bokehPassObj) {
    tl.to(bokehPassObj.uniforms.focus, { value: 3.12, duration: 1.2, ease: "power2.inOut" }, 1.2);
  }

  // Pre-open warm screen glow (amber/orange: 0xd48c17 -> r=0.83, g=0.55, b=0.09)
  tl.fromTo(screenMaterial, { emissiveIntensity: 0.0 }, { emissiveIntensity: 0.8, duration: 0.8, ease: "power2.in" }, 1.3)
    .fromTo(screenMaterial.emissive, { r: 0.0, g: 0.0, b: 0.0 }, { r: 0.83, g: 0.55, b: 0.09, duration: 0.8, ease: "power2.in" }, 1.3);

  // Animate screen light colors to calibrated intensities (prevent blowout)
  tl.fromTo(screenRimLight, { intensity: 0.0 }, { intensity: 0.8, duration: 1.0 }, 1.3)
    .to(screenRimLight.color, { r: 0.83, g: 0.55, b: 0.09, duration: 1.0 }, 1.3)
    .to(keyLight, { intensity: 0.6, duration: 1.0 }, 1.3)
    .to(keyLight.color, { r: 1.0, g: 0.88, b: 0.75, duration: 1.0 }, 1.3);

  // ─── SCROLL 80% - 100% (Logo reveal) ───
  // Smoothly blend logo onto the canvas texture (from 2.4 to 3.0s)
  tl.fromTo(logoOpacity, { value: 0.0 }, { value: 1.0, duration: 0.6, ease: "power2.inOut", onUpdate: drawScreen }, 2.4);

  // Transition emissive color to white to render logo colors (r=1.0, g=1.0, b=1.0)
  tl.to(screenMaterial, { emissiveIntensity: 1.2, duration: 0.6, ease: "power2.inOut" }, 2.4)
    .to(screenMaterial.emissive, { r: 1.0, g: 1.0, b: 1.0, duration: 0.6, ease: "power2.inOut" }, 2.4);

  // Adjust lights to illuminate screen (white light)
  tl.to(screenRimLight, { intensity: 1.2, duration: 0.6 }, 2.4)
    .to(screenRimLight.color, { r: 1.0, g: 1.0, b: 1.0, duration: 0.6 }, 2.4)
    .to(keyLight, { intensity: 0.4, duration: 0.6 }, 2.4)
    .to(keyLight.color, { r: 1.0, g: 1.0, b: 1.0, duration: 0.6 }, 2.4);

  // Fade in final Organized Excellence caption
  tl.to("#logo-caption", { opacity: 1, y: -20, duration: 0.6, ease: "power2.out" }, 2.4);
}

// ─── IDLE MICRO-MOTION ────────────────────────────────────
function applyIdleMotion(delta) {
  const t = clock.elapsedTime;
  // Subtle desk breathing wobble
  if (laptopGroup) {
    laptopGroup.rotation.y = Math.sin(t * 0.6) * 0.003;
  }
}

// ─── RESIZE ──────────────────────────────────────────────
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);

  const bokehPassObj = composer.passes[1];
  if (bokehPassObj) {
    bokehPassObj.uniforms['aspect'].value = camera.aspect;
  }
}

// ─── ANIMATION LOOP ──────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  applyIdleMotion(delta);

  if (composer) {
    composer.render();
  }
}

// ─── START ───────────────────────────────────────────────
init();
animate();

</script>
