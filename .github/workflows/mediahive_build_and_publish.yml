name: MediaHive Mobile App - Build & Publish

on:
  push:
    branches:
      - main
    paths:
      - 'mediahive_mobile/**'
      - '.github/workflows/mediahive_build_and_publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          cd mediahive_mobile
          flutter pub get

      - name: Setup Environment Files
        run: |
          cd mediahive_mobile
          echo "SUPABASE_URL=https://fcctcorycpvebupluzpe.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "GITHUB_TOKEN=${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env

      - name: Setup Android Signing
        run: |
          cd mediahive_mobile/android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks
          cat > key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../app/upload-keystore.jks
          EOF
          # Trim leading whitespace from heredoc
          sed -i 's/^          //' key.properties

      - name: Run Build and Release Script
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          cd mediahive_mobile
          python release_app.py
